syntax = "proto3";

package ariadne.v1;

// DataService manages Ariadne data directory usage, storage measurements, and database backups.
service DataService {
  rpc GetDataUsage(GetDataUsageRequest) returns (GetDataUsageResponse);
  rpc GetStorageSnapshot(GetStorageSnapshotRequest) returns (GetStorageSnapshotResponse);
  rpc MeasureWorktreeReclaimable(MeasureWorktreeReclaimableRequest) returns (MeasureWorktreeReclaimableResponse);
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
}

message BackupInfo {
  string name = 1;
  int64 size = 2;
  int64 created_at = 3;
  bool auto = 4;
}

message GetDataUsageRequest {
  bool include_sizes = 1;
}

message GetDataUsageResponse {
  string home = 1;
  int64 database = 2;
  optional int64 plugins = 3;
  repeated BackupInfo backups = 4;
  string backups_dir = 5;
}

message DirectorySize {
  optional int64 bytes = 1;
  optional int64 exclusive = 2;
  optional int64 reclaimable_estimate = 3;
}

message StorageSnapshot {
  optional int64 managed = 1;
  optional int64 total = 2;
  map<string, DirectorySize> worktrees = 3;
  bool logical = 4;
  int64 measured_at = 5;
}

message GetStorageSnapshotRequest {
  bool cached_only = 1;
}

message GetStorageSnapshotResponse {
  optional StorageSnapshot storage = 1;
}

message MeasureWorktreeReclaimableRequest {
  string path = 1;
}

message MeasureWorktreeReclaimableResponse {
  optional int64 exclusive = 1;
}

message CreateBackupRequest {}

message CreateBackupResponse {
  BackupInfo backup = 1;
}

message DeleteBackupRequest {
  string name = 1;
}

message DeleteBackupResponse {}
