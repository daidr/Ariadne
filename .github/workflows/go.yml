name: go-backend

on:
  push:
    branches: [master]
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]
  pull_request:
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - id: go-env
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ steps.go-env.outputs.mod }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-env.outputs.build }}
          key: gobuild-proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            gobuild-proto-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run proto:check

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - id: go-env
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-env.outputs.mod }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-env.outputs.build }}
          key: gobuild-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            gobuild-native-${{ runner.os }}-${{ runner.arch }}-
      - run: go version
      # Workspaces exercise many rooted filesystem operations. Do not spend
      # minutes hashing their temporary inputs after the tests have finished.
      - run: go test -count=1 -parallel=4 -timeout=180s ./...
      - run: go vet ./...

  race:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - id: go-env
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-env.outputs.mod }}
          key: gomod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gomod-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v5
        with:
          path: ${{ steps.go-env.outputs.build }}
          key: gobuild-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            gobuild-race-${{ runner.os }}-${{ runner.arch }}-
      - run: go version
      - run: go test -race -count=1 -parallel=4 -timeout=300s ./...
