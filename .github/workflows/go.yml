name: go-backend

on:
  push:
    branches: [master]
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]
  pull_request:
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - run: go version
      # Workspaces exercise many rooted filesystem operations. Do not spend
      # minutes hashing their temporary inputs after the tests have finished.
      - run: go test -count=1 -parallel=4 -timeout=180s ./...
      - run: go vet ./...

  race:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
      - run: go version
      - run: go test -race -count=1 -parallel=4 -timeout=300s ./...
