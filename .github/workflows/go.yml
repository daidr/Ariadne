name: go-backend

on:
  push:
    branches: [master]
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]
  pull_request:
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-proto-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: bun run proto:check

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-native-${{ runner.os }}-${{ runner.arch }}-
      # Start the heaviest test packages first so they run alongside fast packages
      # instead of leaving a long serial tail at the end of the run.
      - name: Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          all="$(go list ./...)"
          pkgs=()
          for p in \
            github.com/daidr/Ariadne/internal/local \
            github.com/daidr/Ariadne/internal/browser \
            github.com/daidr/Ariadne/internal/runner \
            github.com/daidr/Ariadne/internal/workspaces \
            github.com/daidr/Ariadne/internal/sources \
            github.com/daidr/Ariadne/internal/process \
            github.com/daidr/Ariadne/internal/update; do
            if printf '%s\n' "$all" | grep -qx "$p"; then
              pkgs+=("$p")
            fi
          done
          while IFS= read -r pkg; do
            case "$pkg" in
              github.com/daidr/Ariadne/internal/local|github.com/daidr/Ariadne/internal/browser|github.com/daidr/Ariadne/internal/runner|github.com/daidr/Ariadne/internal/workspaces|github.com/daidr/Ariadne/internal/sources|github.com/daidr/Ariadne/internal/process|github.com/daidr/Ariadne/internal/update) ;;
              *) pkgs+=("$pkg") ;;
            esac
          done <<< "$all"
          go test -vet=off -count=1 -parallel=4 -timeout=180s "${pkgs[@]}"
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          $ErrorActionPreference = 'Stop'
          $testTmp = Join-Path $env:RUNNER_TEMP 'testtmp'
          New-Item -ItemType Directory -Force -Path $testTmp | Out-Null
          $env:TEMP = $testTmp
          $env:TMP = $testTmp
          $env:GOTMPDIR = $testTmp
          $all = @(go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $priority = @(
            'github.com/daidr/Ariadne/internal/local',
            'github.com/daidr/Ariadne/internal/browser',
            'github.com/daidr/Ariadne/internal/runner',
            'github.com/daidr/Ariadne/internal/workspaces',
            'github.com/daidr/Ariadne/internal/sources',
            'github.com/daidr/Ariadne/internal/process',
            'github.com/daidr/Ariadne/internal/update'
          ) | Where-Object { $_ -in $all }
          $pkgs = $priority + ($all | Where-Object { $_ -notin $priority })
          go test -vet=off -count=1 -p=6 -parallel=4 -timeout=180s @pkgs
          exit $LASTEXITCODE
      - if: matrix.os == 'ubuntu-latest'
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: go vet ./...

  race:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ runner.arch }}-
      - name: Test with race detector
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          all="$(go list ./...)"
          pkgs=()
          for p in \
            github.com/daidr/Ariadne/internal/local \
            github.com/daidr/Ariadne/internal/browser \
            github.com/daidr/Ariadne/internal/runner \
            github.com/daidr/Ariadne/internal/workspaces \
            github.com/daidr/Ariadne/internal/sources \
            github.com/daidr/Ariadne/internal/process \
            github.com/daidr/Ariadne/internal/update; do
            if printf '%s\n' "$all" | grep -qx "$p"; then
              pkgs+=("$p")
            fi
          done
          while IFS= read -r pkg; do
            case "$pkg" in
              github.com/daidr/Ariadne/internal/local|github.com/daidr/Ariadne/internal/browser|github.com/daidr/Ariadne/internal/runner|github.com/daidr/Ariadne/internal/workspaces|github.com/daidr/Ariadne/internal/sources|github.com/daidr/Ariadne/internal/process|github.com/daidr/Ariadne/internal/update) ;;
              *) pkgs+=("$pkg") ;;
            esac
          done <<< "$all"
          go test -vet=off -race -count=1 -parallel=4 -timeout=300s "${pkgs[@]}"
