name: go-backend

on:
  push:
    branches: [master]
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]
  pull_request:
    paths:
      [
        'go.mod',
        'go.sum',
        '.go-version',
        'buf.yaml',
        'buf.gen.yaml',
        'proto/**',
        'package.json',
        'bun.lock',
        'internal/**',
        'sdk/**',
        'cmd/**',
        'tools/**',
        'packages/**',
        '.github/workflows/go.yml',
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proto:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-proto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-proto-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: bun run proto:check

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Exclude workspace and build paths from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          try {
            Add-MpPreference `
              -ExclusionPath @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, 'C:\hostedtoolcache', 'C:\Program Files\Git') `
              -ExclusionProcess @('go.exe', 'git.exe', 'compile.exe', 'link.exe', 'asm.exe', 'chrome.exe', 'msedge.exe') `
              -ErrorAction SilentlyContinue
          } catch {}
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-native-${{ runner.os }}-${{ runner.arch }}-
      # Ubuntu runs the complete test suite; macOS and Windows compile every
      # library package and run all OS-sensitive / integration packages so every
      # platform stays fast without losing cross-OS behavioral coverage.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          all="$(go list ./...)"
          pkgs=()
          for p in \
            github.com/daidr/Ariadne/internal/local \
            github.com/daidr/Ariadne/internal/browser \
            github.com/daidr/Ariadne/internal/runner \
            github.com/daidr/Ariadne/internal/workspaces \
            github.com/daidr/Ariadne/internal/server \
            github.com/daidr/Ariadne/internal/application \
            github.com/daidr/Ariadne/internal/service \
            github.com/daidr/Ariadne/internal/sources \
            github.com/daidr/Ariadne/internal/process \
            github.com/daidr/Ariadne/internal/update; do
            if printf '%s\n' "$all" | grep -qx "$p"; then
              pkgs+=("$p")
            fi
          done
          while IFS= read -r pkg; do
            case "$pkg" in
              github.com/daidr/Ariadne/internal/local|github.com/daidr/Ariadne/internal/browser|github.com/daidr/Ariadne/internal/runner|github.com/daidr/Ariadne/internal/workspaces|github.com/daidr/Ariadne/internal/server|github.com/daidr/Ariadne/internal/application|github.com/daidr/Ariadne/internal/service|github.com/daidr/Ariadne/internal/sources|github.com/daidr/Ariadne/internal/process|github.com/daidr/Ariadne/internal/update) ;;
              *) pkgs+=("$pkg") ;;
            esac
          done <<< "$all"
          go test -vet=off -count=1 -parallel=4 -timeout=180s "${pkgs[@]}"
      - name: Test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          go build ./internal/... ./sdk/...
          listed="$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}} {{.GoFiles}} {{.TestGoFiles}} {{.XTestGoFiles}}{{end}}' ./... | grep -v '^$')"
          all="$(printf '%s\n' "$listed" | awk '{print $1}')"
          os_tagged="$(printf '%s\n' "$listed" | grep -E '_darwin|_unix' | awk '{print $1}' || true)"
          pkgs=()
          add_pkg() {
            local p="$1"
            printf '%s\n' "$all" | grep -qx "$p" || return 0
            local existing
            for existing in ${pkgs[@]+"${pkgs[@]}"}; do
              [ "$existing" = "$p" ] && return 0
            done
            pkgs+=("$p")
          }
          for p in \
            github.com/daidr/Ariadne/internal/browser \
            github.com/daidr/Ariadne/internal/runner \
            github.com/daidr/Ariadne/internal/local \
            github.com/daidr/Ariadne/internal/server \
            github.com/daidr/Ariadne/internal/workspaces \
            github.com/daidr/Ariadne/internal/application \
            github.com/daidr/Ariadne/internal/service \
            github.com/daidr/Ariadne/cmd/ariadne \
            github.com/daidr/Ariadne/internal/process \
            github.com/daidr/Ariadne/internal/update \
            github.com/daidr/Ariadne/internal/core \
            github.com/daidr/Ariadne/internal/sources \
            github.com/daidr/Ariadne/internal/agentruntime \
            github.com/daidr/Ariadne/internal/fsutil \
            github.com/daidr/Ariadne/internal/plugins \
            github.com/daidr/Ariadne/internal/repowatch \
            github.com/daidr/Ariadne/internal/background \
            github.com/daidr/Ariadne/internal/providers/acp \
            github.com/daidr/Ariadne/internal/providers/antigravity \
            github.com/daidr/Ariadne/internal/providers/claudecode \
            github.com/daidr/Ariadne/internal/providers/codex \
            github.com/daidr/Ariadne/internal/eventstore \
            github.com/daidr/Ariadne/internal/settings \
            github.com/daidr/Ariadne/internal/trace \
            github.com/daidr/Ariadne/internal/modelhttp \
            github.com/daidr/Ariadne/internal/data; do
            add_pkg "$p"
          done
          while IFS= read -r p; do
            [ -n "$p" ] && add_pkg "$p"
          done <<< "$os_tagged"
          go test -vet=off -count=1 -p=4 -parallel=4 -timeout=180s "${pkgs[@]}"
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          $ErrorActionPreference = 'Stop'
          $testTmp = Join-Path $env:RUNNER_TEMP 'testtmp'
          New-Item -ItemType Directory -Force -Path $testTmp | Out-Null
          $env:TEMP = $testTmp
          $env:TMP = $testTmp
          $env:GOTMPDIR = $testTmp
          go build ./internal/... ./sdk/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $listed = @(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}} {{.GoFiles}} {{.TestGoFiles}} {{.XTestGoFiles}}{{end}}' ./... | Where-Object { $_ -ne '' })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $all = @($listed | ForEach-Object { ($_ -split ' ')[0] })
          $osTagged = @($listed | Where-Object { $_ -match '_windows' } | ForEach-Object { ($_ -split ' ')[0] })
          $core = @(
            'github.com/daidr/Ariadne/internal/local',
            'github.com/daidr/Ariadne/internal/runner',
            'github.com/daidr/Ariadne/internal/browser',
            'github.com/daidr/Ariadne/internal/workspaces',
            'github.com/daidr/Ariadne/internal/server',
            'github.com/daidr/Ariadne/internal/application',
            'github.com/daidr/Ariadne/internal/service',
            'github.com/daidr/Ariadne/cmd/ariadne',
            'github.com/daidr/Ariadne/internal/core',
            'github.com/daidr/Ariadne/internal/sources',
            'github.com/daidr/Ariadne/internal/process',
            'github.com/daidr/Ariadne/internal/update',
            'github.com/daidr/Ariadne/internal/agentruntime',
            'github.com/daidr/Ariadne/internal/fsutil',
            'github.com/daidr/Ariadne/internal/plugins',
            'github.com/daidr/Ariadne/internal/repowatch',
            'github.com/daidr/Ariadne/internal/background',
            'github.com/daidr/Ariadne/internal/providers/acp',
            'github.com/daidr/Ariadne/internal/providers/antigravity',
            'github.com/daidr/Ariadne/internal/providers/claudecode',
            'github.com/daidr/Ariadne/internal/providers/codex',
            'github.com/daidr/Ariadne/internal/eventstore',
            'github.com/daidr/Ariadne/internal/settings',
            'github.com/daidr/Ariadne/internal/trace',
            'github.com/daidr/Ariadne/internal/modelhttp',
            'github.com/daidr/Ariadne/internal/data'
          )
          $pkgs = [System.Collections.Generic.List[string]]::new()
          foreach ($p in ($core + $osTagged)) {
            if (($p -in $all) -and -not $pkgs.Contains($p)) {
              $pkgs.Add($p)
            }
          }
          go test -vet=off -count=1 -p=4 -parallel=4 -timeout=180s @pkgs
          exit $LASTEXITCODE
      - if: matrix.os == 'ubuntu-latest'
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: go vet ./...

  race:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gomod
            ${{ runner.temp }}/gobuild
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'go.sum') }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ runner.arch }}-
      - name: Test with race detector
        shell: bash
        env:
          GOMODCACHE: ${{ runner.temp }}/gomod
          GOCACHE: ${{ runner.temp }}/gobuild
        run: |
          all="$(go list ./...)"
          pkgs=()
          for p in \
            github.com/daidr/Ariadne/internal/runner \
            github.com/daidr/Ariadne/internal/local \
            github.com/daidr/Ariadne/internal/core \
            github.com/daidr/Ariadne/internal/update \
            github.com/daidr/Ariadne/internal/workspaces \
            github.com/daidr/Ariadne/internal/browser \
            github.com/daidr/Ariadne/internal/server \
            github.com/daidr/Ariadne/internal/application \
            github.com/daidr/Ariadne/internal/service \
            github.com/daidr/Ariadne/internal/process \
            github.com/daidr/Ariadne/internal/sources; do
            if printf '%s\n' "$all" | grep -qx "$p"; then
              pkgs+=("$p")
            fi
          done
          while IFS= read -r pkg; do
            case "$pkg" in
              github.com/daidr/Ariadne/internal/runner|github.com/daidr/Ariadne/internal/local|github.com/daidr/Ariadne/internal/core|github.com/daidr/Ariadne/internal/update|github.com/daidr/Ariadne/internal/workspaces|github.com/daidr/Ariadne/internal/browser|github.com/daidr/Ariadne/internal/server|github.com/daidr/Ariadne/internal/application|github.com/daidr/Ariadne/internal/service|github.com/daidr/Ariadne/internal/process|github.com/daidr/Ariadne/internal/sources) ;;
              *) pkgs+=("$pkg") ;;
            esac
          done <<< "$all"
          go test -vet=off -race -count=1 -parallel=4 -timeout=300s "${pkgs[@]}"
